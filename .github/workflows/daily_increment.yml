name: Daily increment (today's bar only)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *" # ежедневно ~18:30 Берлин (16:30 UTC зимой)

jobs:
  daily_increment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Clone private core repo
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Incremental (today’s bar only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd prognostika-core
          python -m orchestrator.daily_increment

      - name: Commit watermarks (auto-heal)
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name "Prognostika Bot"
          git fetch origin main
          git checkout main
          git pull https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true

          git add manifests/checkpoints/WATERMARKS.jsonl || true
          git commit -m "[bot] daily watermarks $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || echo "nothing to commit"

          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main || (
            echo "⚠️ fast-forward, retrying"
            git pull --rebase https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true
            git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main --force
          )
          echo "✅ daily increment pushed"
