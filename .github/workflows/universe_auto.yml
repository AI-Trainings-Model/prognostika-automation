name: Prognostika – full auto (discover → retro → daily)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "05 02 * * *"   # 02:05 UTC discover universe
    - cron: "20 02 * * *"   # 02:20 UTC retro plan + backfill
    - cron: "15 16 * * 1-5" # 16:15 UTC (weekdays) daily increment

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone PRIVATE core
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover universe (auto-extend)
        run: |
          cd prognostika-core
          python -m orchestrator.discover_universe

      - name: Commit registry update
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name  "Prognostika Bot"
          git add manifests/registry/symbols_master.jsonl || true
          git commit -m "[bot] universe discovery" || echo "nothing to commit"
          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main

  plan_and_backfill:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone PRIVATE core
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build retro plan (auto)
        env:
          MAX_SYMBOLS_PER_RUN: "20"
          DEFAULT_SOURCE: "stooq"
        run: |
          cd prognostika-core
          python -m orchestrator.plan_retro
          cat manifests/tasks/retro_plan.matrix.json

      - name: Read matrix
        id: m
        run: |
          cd prognostika-core
          echo "matrix=$(cat manifests/tasks/retro_plan.matrix.json)" >> $GITHUB_OUTPUT

      - name: Backfill batch
        if: ${{ fromJson(steps.m.outputs.matrix).include && fromJson(steps.m.outputs.matrix).include[0] != null }}
        run: |
          cd prognostika-core
          python - <<'PY'
import os, json, subprocess, sys
m = json.loads(open("manifests/tasks/retro_plan.matrix.json","r",encoding="utf-8").read())["include"]
for t in m:
    cmd = f'HF_TOKEN="${{ secrets.HF_TOKEN }}" python -m orchestrator.retro_backfill --symbol "{t["symbol"]}" --exchange "{t["exchange"]}" --source "{t["source"]}"'
    print("→", cmd)
    rc = subprocess.call(cmd, shell=True)
    if rc != 0:
        sys.exit(rc)
PY

      - name: Commit progress
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name  "Prognostika Bot"
          git add manifests/checkpoints/RETRO_PROGRESS.jsonl manifests/tasks/retro_plan.matrix.json || true
          git commit -m "[retro] progress" || echo "nothing to commit"
          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main

  daily_increment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone PRIVATE core
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Incremental (today’s bar only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd prognostika-core
          python -m orchestrator.daily_increment

      - name: Commit watermarks
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name  "Prognostika Bot"
          git add manifests/checkpoints/WATERMARKS.jsonl || true
          git commit -m "[bot] daily watermarks" || echo "nothing to commit"
          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main
