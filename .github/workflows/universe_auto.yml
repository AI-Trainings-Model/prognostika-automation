name: Discover universe (auto-extend)

on:
  workflow_dispatch:
  schedule:
    - cron: "05 16 * * *" # каждый день ~18:05 по Берлину (16:05 UTC зимой)

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Clone private core repo
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover universe (auto-extend)
        run: |
          cd prognostika-core
          python -m orchestrator.discover_universe

      - name: Commit registry update (auto-heal)
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name "Prognostika Bot"
          git fetch origin main
          git checkout main
          git pull https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true

          # возможные артефакты discover/plan — добавляем все варианты
          git add manifests/registry/symbols_master.jsonl || true
          git add manifests/tasks/universe_registry.jsonl manifests/tasks/backlog.jsonl || true
          git add manifests/stacks/universe_registry.json || true

          git commit -m "[bot] update universe registry $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || echo "nothing to commit"

          # push с авто-восстановлением при non-fast-forward
          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main || (
            echo "⚠️ Fast-forward error, retrying with rebase"
            git pull --rebase https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true
            git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main --force
          )
          echo "✅ registry pushed"
