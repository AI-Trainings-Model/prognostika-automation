name: Retro backfill (simple & safe)

on:
  workflow_dispatch:

jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Clone private core repo
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          git clone https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd prognostika-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build plan (debug + run script)
        run: |
          cd prognostika-core
          echo "PWD=$(pwd)"
          echo "=== ls -la (root) ==="
          ls -la
          echo "=== ls -la orchestrator ==="
          ls -la orchestrator || true
          echo "=== python -V ==="
          python -V
          echo "=== RUN plan_build.py ==="
          python orchestrator/plan_build.py

      - name: Backfill all (by plan)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd prognostika-core
          echo "=== RUN run_backfill_batch.py ==="
          python orchestrator/run_backfill_batch.py

      - name: Commit & push progress (auto-heal)
        env:
          CORE_PAT: ${{ secrets.CORE_PAT }}
        run: |
          cd prognostika-core
          git config user.email "bot@prognostika.ai"
          git config user.name  "Prognostika Bot"
          git fetch origin main
          git checkout main
          git pull https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true

          git add manifests/checkpoints/RETRO_PROGRESS.jsonl manifests/checkpoints/WATERMARKS.jsonl manifests/stacks/universe_registry.json || true
          git commit -m "[bot] retro progress $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || echo "nothing to commit"

          git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main || (
            git pull --rebase https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true
            git push https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main --force
          )
