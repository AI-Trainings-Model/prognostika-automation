- name: Commit & push progress
    env:
      CORE_PAT: ${{ secrets.CORE_PAT }}
    run: |
      cd prognostika-core
      git config user.email "bot@prognostika.ai"
      git config user.name "Prognostika Bot"
      git pull --rebase https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git main || true
      git add manifests/checkpoints/RETRO_PROGRESS.jsonl manifests/checkpoints/WATERMARKS.jsonl || true
      git commit -m "[retro] progress update" || echo "nothing to commit"
      git push --force https://x-access-token:${CORE_PAT}@github.com/AI-Trainings-Model/prognostika-core.git HEAD:main
      echo "✅ Progress pushed to prognostika-core"
